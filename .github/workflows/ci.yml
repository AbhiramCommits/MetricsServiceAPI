name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/warehouse
      PYTHONPATH: .

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply schema and seed
        run: |
          python scripts/apply_schema.py
          python scripts/seed_source.py

      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest with coverage
        run: pytest --cov=metrics_service --cov-report=term-missing

      - name: mypy (advisory)
        continue-on-error: true
        run: mypy metrics_service
